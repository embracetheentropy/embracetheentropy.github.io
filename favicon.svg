<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background rounded square -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#050816"/>

  <!-- Three horizontal bars forming a stylized "E" -->
  <rect x="16" y="16" width="22" height="4" rx="2" fill="#f5f5f5"/>
  <rect x="16" y="30" width="22" height="4" rx="2" fill="#f5f5f5"/>
  <rect x="16" y="44" width="22" height="4" rx="2" fill="#f5f5f5"/>

  <!-- Bars dissolving into dots (entropy increasing) -->
  <!-- Top row -->
  <circle cx="44" cy="18" r="2.4" fill="#f5f5f5"/>
  <!-- Middle row -->
  <circle cx="44" cy="32" r="2.0" fill="#f5f5f5"/>
  <!-- Bottom row -->
  <circle cx="44" cy="46" r="2.8" fill="#f5f5f5"/>
</svg>
